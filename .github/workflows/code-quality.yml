name: Code Quality Check

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 📦 Restore dependencies
        run: dotnet restore VETFEED.Backend.API/VETFEED.Backend.API.csproj

      - name: 🎨 Check code formatting
        run: dotnet format VETFEED.Backend.API/VETFEED.Backend.API.csproj --verify-no-changes --verbosity diagnostic
        continue-on-error: true

      - name: 📊 Code Quality Summary
        run: |
          echo "✅ Code quality check completed!"
          echo "Note: Formatting warnings are informational only."
