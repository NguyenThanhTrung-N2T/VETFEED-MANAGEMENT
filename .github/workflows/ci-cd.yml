name: VetFeed Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Job 1: Build & Test (CI)
  # ==========================================
  ci-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 📦 Restore dependencies
        run: dotnet restore

      - name: 🎨 Check code formatting
        run: dotnet format VETFEED.Backend.API/VETFEED.Backend.API.csproj --verify-no-changes --verbosity diagnostic
        continue-on-error: true

      - name: 🔨 Build
        run: dotnet build --configuration Release --no-restore

      - name: 🧪 Run Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

  # ==========================================
  # Job 2: DevSecOps Scans
  # ==========================================
  devsecops-scans:
    runs-on: ubuntu-latest
    needs: ci-build-and-test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔑 Run Gitleaks (Secret Scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 📦 Audit NuGet Packages
        run: dotnet list package --vulnerable
        continue-on-error: true

  # ==========================================
  # Job 3: Docker Build & Push to GHCR
  # ==========================================
  docker-build-and-push:
    runs-on: ubuntu-latest
    needs: devsecops-scans
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Set Lowercase Image Name
        run: |
          RAW_IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/vetfeed-backend"
          LOWER_IMAGE_NAME=$(echo "$RAW_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$LOWER_IMAGE_NAME" >> $GITHUB_ENV
          echo "Set IMAGE_NAME to: $LOWER_IMAGE_NAME"

      - name: 🔨 Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛡️ Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '0' # Don't break build for demonstration, but log all vulnerabilities
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: 🚀 Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 4: Railway Deployment Health Check
  # ==========================================
  railway-deploy-health-check:
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: 🩺 Wait & Verify Staging URL
        env:
          STAGING_URL: ${{ secrets.RAILWAY_STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "⚠️ RAILWAY_STAGING_URL secret is not configured. Skipping health check."
            exit 0
          fi
          
          echo "⏳ Waiting for Railway auto-deploy to compile and start up (2 minutes)..."
          sleep 120
          
          echo "🔍 Running health check against https://$STAGING_URL/health"
          max_attempts=6
          attempt=1
          success=false
          
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            response=$(curl -s -o /dev/null -w "%{http_code}" https://$STAGING_URL/health || true)
            
            if [ "$response" = "200" ]; then
              echo "✅ Health check PASSED! Staging API is Healthy."
              success=true
              break
            else
              echo "❌ Health check failed with status code: $response. Retrying in 20 seconds..."
              sleep 20
              attempt=$((attempt+1))
            fi
          done
          
          if [ "$success" = false ]; then
            echo "❌ Staging Health Check Failed."
            exit 1
          fi
