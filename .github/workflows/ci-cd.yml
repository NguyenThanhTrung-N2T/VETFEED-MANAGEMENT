name: VetFeed Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Job 1: Build & Test (CI)
  # ==========================================
  ci-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 📦 Restore dependencies
        run: dotnet restore VETFEED.Backend.slnx

      - name: 🎨 Check code formatting
        run: dotnet format VETFEED.Backend.API/VETFEED.Backend.API.csproj --verify-no-changes --verbosity diagnostic

      - name: 🔨 Build
        run: dotnet build VETFEED.Backend.slnx --configuration Release --no-restore

      - name: 🧪 Run Tests with Coverage
        run: |
          dotnet test VETFEED.Backend.Tests/VETFEED.Backend.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage"

      - name: 📤 Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/TestResults/**/coverage.cobertura.xml"

  # ==========================================
  # Job 2: DevSecOps Scans
  # ==========================================
  devsecops-scans:
    runs-on: ubuntu-latest
    needs: ci-build-and-test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔑 Run Gitleaks (Secret Scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 📦 Audit NuGet Packages
        run: dotnet list package --vulnerable

  # ==========================================
  # Job 3: Docker Build, Verify & Publish (CD)
  # ==========================================
  docker-build-verify-publish:
    runs-on: ubuntu-latest
    needs: devsecops-scans
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Set Lowercase Image Name
        run: |
          RAW_IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/vetfeed-backend"
          LOWER_IMAGE_NAME=$(echo "$RAW_IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$LOWER_IMAGE_NAME" >> $GITHUB_ENV
          echo "Set IMAGE_NAME to: $LOWER_IMAGE_NAME"

      - name: 🔨 Build Docker Image (Local Load)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛡️ Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'table'
          exit-code: '1' # Break the build if CRITICAL vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: 🧪 Container Runtime Smoke Test
        run: |
          echo "🚀 Starting container..."
          docker run -d -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e ASPNETCORE_URLS=http://+:8080 \
            -e Jwt__Key="demo-key-for-ci-only-demo-key-for-ci-only" \
            -e Jwt__Issuer="VETFEED" \
            -e Jwt__Audience="VETFEED.Client" \
            --name test-api \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          echo "⏳ Waiting 20 seconds for startup..."
          sleep 20
          
          echo "🔍 Calling health check endpoint..."
          curl --fail --show-error http://localhost:8080/health
          
          echo "✅ Smoke test PASSED! Container is fully operational."

      - name: ❌ Dump Container Logs on Failure
        if: failure()
        run: |
          echo "⚠️ Dump logs from crashed container:"
          docker logs test-api || true

      - name: 🚀 Publish Docker Image to GHCR
        run: |
          echo "📤 Pushing images to registry..."
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          echo "🎉 Image published successfully to GHCR!"

      - name: 🧹 Cleanup Test Container
        if: always()
        run: |
          echo "🧹 Cleaning up test container..."
          docker rm -f test-api || true
